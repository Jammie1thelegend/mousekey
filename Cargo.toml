[package]
name = "mousekey"
version = "0.1.0"
edition = "2024"

[dependencies]
enigo = "0.6.1"
env_logger = "0.11.10"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.1.2"
windows = {version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"]}


# used to panic! the entire program from a thread
[profile.release]
panic = 'abort'

[profile.dev]
panic = 'abort'
